<title>Reha</title>
<style>
  :root{--cream:#faf4ea;--sand:#f1e7d8;--espresso:#2c211a;--terra:#c26a43;--terra-d:#a9552f;--amber:#dda15e;--soft:#6b5a4c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--espresso);
    background:linear-gradient(180deg,var(--cream),var(--sand))}
  .card{width:100%;max-width:360px;background:#fffaf2;border:1px solid rgba(44,33,26,.08);border-radius:22px;
    padding:30px 24px;box-shadow:0 18px 40px rgba(44,33,26,.1);text-align:center}
  .logo{font-weight:800;font-size:22px;letter-spacing:.04em}.logo span{color:var(--terra)}
  h1{font-size:20px;margin:18px 0 6px}
  p{margin:0 0 20px;color:var(--soft);font-size:15px;line-height:1.45}
  input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;
    border:1.5px solid rgba(44,33,26,.2);background:#fff;color:var(--espresso);text-align:center;letter-spacing:.04em}
  input[type=password]:focus{outline:none;border-color:var(--terra)}
  label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 18px;font-size:14px;color:var(--soft)}
  button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:14px;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(90deg,var(--terra),var(--amber));color:var(--espresso)}
  button:disabled{opacity:.6;cursor:wait}
  .err{min-height:20px;margin-top:12px;font-size:14px;color:var(--terra-d)}
</style>
</head>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'cellora-key:' + location.pathname.replace(/index\.html$/, '');
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var toB64 = function(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };
  var salt = b64(P.salt), iv = b64(P.iv), ct = b64(P.ct), mac = b64(P.mac);

  async function ableiten(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:salt, iterations:P.iter}, base, 512);
  }
  async function oeffnen(bits){
    bits = new Uint8Array(bits);
    var macKey = await crypto.subtle.importKey('raw', bits.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
    var daten = new Uint8Array(iv.length + ct.length); daten.set(iv); daten.set(ct, iv.length);
    if (!(await crypto.subtle.verify('HMAC', macKey, mac, daten))) return false;
    var encKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name:'AES-CBC'}, false, ['decrypt']);
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv:iv}, encKey, ct));
    document.open(); document.write(html); document.close();
    return true;
  }
  // Eigener Speicherbereich pro Kunden-App (sonst teilen sich alle Apps unter cellora.de die Einträge)
  var PREFIX = 'app:' + location.pathname.replace(/index\.html$/, '') + ':';
  if (false) window.storage = {
    get: async function(k){ try { var v = localStorage.getItem(PREFIX + k); return v == null ? null : { value: v }; } catch(e){ return null; } },
    set: async function(k, v){ try { localStorage.setItem(PREFIX + k, v); return true; } catch(e){ return false; } }
  };
  // Offline-Fähigkeit schon auf der Passwortseite einrichten
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});

  function speichern(bits){ try { localStorage.setItem(KEY, toB64(bits)); } catch(e){} }

  // Gemerkter Schlüssel? Dann direkt öffnen.
  var gemerkt = null; try { gemerkt = localStorage.getItem(KEY); } catch(e){}
  if (gemerkt) {
    document.getElementById('f').style.visibility = 'hidden';   // kein Aufblitzen der Passwortseite
    var auto = function(){
      oeffnen(b64(gemerkt)).then(function(ok){
        if (!ok) { try{ localStorage.removeItem(KEY); }catch(e){} document.getElementById('f').style.visibility = ''; }
      }).catch(function(){ document.getElementById('f').style.visibility = ''; });
    };
    // Erst nach dem vollständigen Laden ersetzen, sonst hängt der Browser die App nur unten an
    if (document.readyState === 'complete') auto(); else window.addEventListener('load', auto);
  }

  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('btn'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Wird geöffnet …'; err.textContent = '';
    try {
      var bits = await ableiten(document.getElementById('pw').value.trim());
      if (document.getElementById('merken').checked) speichern(bits);
      if (!(await oeffnen(bits))) {
        try { localStorage.removeItem(KEY); } catch(e){}
        err.textContent = 'Das Passwort stimmt nicht. Bitte noch einmal versuchen.';
        btn.disabled = false; btn.textContent = 'Öffnen';
      }
    } catch(x) {
      err.textContent = 'Das hat nicht geklappt. Bitte die Seite neu laden.';
      btn.disabled = false; btn.textContent = 'Öffnen';
    }
  });
})();
</script>
